# fly.toml app configuration file generated for searing-render on 2026-11-12T02:05:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'searing-render'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
